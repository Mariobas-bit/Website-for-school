<!DOCTYPE html>
<html>
  <head>
    <title>Domain 3 Forms</title>
  </head>
  <body>
    <h1>D3 Creating Forms in HTML</h1>

    <img src="assets/images/ESports.png" alt="Esports" width="100px">
    <h2>Contact Us</h2>
    
    <p>Interested in more info? Fill out the form below and submit. We look forward to hearing from you</p>

    <form action="" method="post">
    <fieldset>
          <legend>Personal</legend>
        <label for="firstName">First Name</label>
        <input type="text" name="firstName" id="firstName" accesskey="f" tabindex"1"> <br>

        <label for "lastName">Last Name</label>
        <input type="text" name="lastName" id="lastName" accesskey="l" tabindex"2"> <br>

        <label for="email">Email</label>
        <input type="email" name="email" if="email" accesskey="e" tabindex="3"> <br>
    </fieldset>
    </form>
    <form action="" method="post">
    <fieldset>
      <legend>Questions</legend>
      <select name="found" id="found">
        <option selected value="Choose One">Choose One</option>
        <option value="TV">TV</option>
        <option value="Social Media">Social Media</option>
        <option value="Friend">Friend</option>
        <option value="Newspaper">Newspaper</option>
        <option value="Billboard">Billboard</option>
        <option value="Family">Family</option>
        <option value"Other">Other</option>
      </select>

      <p>Add comments below</p>

      <textarea rows="6" cols="50" maxlength="255"></textarea>
      <button name="showimage" onclick="">Show Image</button>
      <input type="submit" name="submitform" value="Send it">
    </fieldset>
    
  </body>
</html>
